name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit bandit
      - name: Run test suite
        run: pytest
      - name: Run Ruff correctness checks
        run: ruff check . --select E4,E7,E9,F
      - name: Audit installed dependencies
        run: pip-audit --strict
      - name: Scan Python code with Bandit
        run: bandit -r aether_core -ll -iii

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
