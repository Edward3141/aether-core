[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-core"
version = "0.1.0"
description = "Human-supervised multi-agent system diagnostics and remediation planning"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Edward Tejada" }]
dependencies = ["pydantic>=2.7,<3", "python-dotenv>=1.0", "rich>=13.7", "litellm>=1.40", "mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aether-core = "aether_core.cli:entry_point"
aether-core-mcp = "aether_core.mcp.server:main"

[tool.setuptools.packages.find]
include = ["aether_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
